# Football AI Analyzer Configuration

# Model settings
model:
  name: "yolov8s.pt"  # Small model - better accuracy, still fast
  confidence_threshold: 0.25  # Lowered to catch pre-snap players
  iou_threshold: 0.45  # IoU threshold for NMS
  device: "cuda"  # Use GPU (RTX 4070), set to "cpu" if needed

# Detection settings
detection:
  target_classes: ["person"]  # Detect people (players)
  draw_boxes: true  # Draw bounding boxes on output
  draw_labels: true  # Draw class labels on output
  box_color: [0, 255, 0]  # Green boxes (BGR format)
  box_thickness: 2

# Video settings
video:
  input_path: "data/raw/play1.mp4"  # Path to input video
  output_path: "data/processed/play1_detected.mp4"  # Path to output video
  fps: 30  # Output FPS
  fourcc: "mp4v"  # Video codec

# Processing settings
processing:
  skip_frames: 0  # Process every Nth frame (0 = process all frames)
  resize_width: 1280  # Resize video width for faster processing (0 = original)
  resize_height: 720  # Resize video height for faster processing (0 = original)

# Formation analysis settings
formation_analysis:
  width_threshold: 0.5  # Formation width threshold (50% of field width)
  min_players: 10  # Minimum players to consider formation valid
  output_path: "data/processed/formation_analysis.json"  # Path to save analysis results
